<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#741529"/>
      <stop offset="45%" stop-color="#8a142c"/>
      <stop offset="100%" stop-color="#1c2c85"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f96174"/>
      <stop offset="100%" stop-color="#6088fa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2547eb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2547eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="120" r="320" fill="url(#glowA)"/>
  <circle cx="1030" cy="520" r="340" fill="url(#glowB)"/>

  <!-- Star anise mark -->
  <g transform="translate(980 315)">
    <g fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <path d="M0 0V-130"/>
      <path d="M0 0 92-92"/>
      <path d="M0 0H130"/>
      <path d="M0 0 92 92"/>
      <path d="M0 0V130"/>
      <path d="M0 0-92 92"/>
      <path d="M0 0H-130"/>
      <path d="M0 0-92-92"/>
    </g>
    <circle r="52" fill="#fefaf6" opacity="0.95"/>
    <circle r="21" fill="#c81e3c"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#fefaf6">
    <text x="90" y="250" font-size="82" font-weight="bold">Ghizayat Foods</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="92" y="180" font-size="26" fill="#fcd34d" letter-spacing="7">SINCE 1962 · LAHORE</text>
    <text x="92" y="320" font-size="34" fill="#fdf4ec" opacity="0.85">Pure spices, dry fruits &amp; grains</text>
    <text x="92" y="374" font-size="27" fill="#fdf4ec" opacity="0.62">Ground in small batches. Delivered across Pakistan.</text>
  </g>

  <g transform="translate(92 440)">
    <rect width="300" height="62" rx="31" fill="#c81e3c"/>
    <text x="150" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Cash on Delivery</text>
  </g>

  <rect y="614" width="1200" height="16" fill="#c81e3c"/>
  <rect x="400" y="614" width="400" height="16" fill="#f59e0b"/>
  <rect x="800" y="614" width="400" height="16" fill="#1d35d8"/>
</svg>
